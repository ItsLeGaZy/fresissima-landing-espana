<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presupuestador Pro | Fresissima B2B</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="https://fresissima.it/wp-content/uploads/2025/10/favicon-fresissima-150x150.png"
        sizes="192x192">

    <!-- Base Styles -->
    <style>
        :root {
            /* Clinical Palette */
            --primary: #1A202C;
            --primary-light: #2D3748;
            --accent: #FF6B35;
            --accent-hover: #E55A2B;
            --bg-body: #F7FAFC;
            --bg-surface: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --border: #E2E8F0;
            --success: #38A169;

            /* Fonts */
            --font-main: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;

            /* Shadows & Radius */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;

            /* Mobile Adjustments */
            --header-h: 60px;
            --search-h: 130px;
            --cart-bar-h: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-main);
            background: var(--bg-body);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        input {
            font-family: inherit;
        }

        /* -----------------------
           HEADER
           ----------------------- */
        .header {
            background: var(--primary);
            color: white;
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
            z-index: 50;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: white;
        }

        .header-brand img {
            height: 24px;
            filter: brightness(0) invert(1);
        }

        .header-title {
            font-weight: 600;
            font-size: 1rem;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding-left: 0.75rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: white;
        }

        /* -----------------------
           APP LAYOUT
           ----------------------- */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            height: calc(100vh - var(--header-h));
        }

        /* -----------------------
           MAIN AREA (Catalog)
           ----------------------- */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-body);
            position: relative;
            z-index: 10;
        }

        .search-section {
            background: var(--bg-surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            z-index: 20;
            flex-shrink: 0;
        }

        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--bg-body);
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-surface);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15);
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--bg-body);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Results List */
        .results-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            /* Bottom padding for mobile cart bar */
            padding-bottom: calc(var(--cart-bar-h) + 1.5rem);
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .product-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .prod-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .prod-brand {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 0.25rem;
        }

        .brand-fresissima {
            background: #EBF4FF;
            color: #2B6CB0;
        }

        .brand-dentag {
            background: #E6FFFA;
            color: #2C7A7B;
        }

        .brand-vibra {
            background: #FAF5FF;
            color: #6B46C1;
        }

        .brand-xtruments {
            background: #FFF5F5;
            color: #C53030;
        }

        .prod-code {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .prod-pack {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .prod-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--border);
            padding-top: 0.75rem;
        }

        .prod-price {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--success);
        }

        .btn-add {
            background: var(--accent);
            color: white;
            border-radius: var(--radius-md);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 4px rgba(255, 107, 53, 0.2);
            transition: all 0.2s;
        }

        .btn-add:active {
            transform: scale(0.9);
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        /* -----------------------
           CART / QUOTE SIDEBAR (Mobile Sheet / Desktop Sidebar)
           ----------------------- */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }

        .cart-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .cart-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90vh;
            /* Bottom sheet on mobile */
            background: var(--bg-surface);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            z-index: 110;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-float);
        }

        .cart-panel.show {
            transform: translateY(0);
        }

        .cart-mobile-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 12px auto;
        }

        .cart-header {
            padding: 0 1.5rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .close-cart {
            color: var(--text-muted);
            padding: 0.5rem;
        }

        .cart-client {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-body);
        }

        .client-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .client-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background: var(--bg-surface);
        }

        .client-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.5rem;
        }

        .cart-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 0;
        }

        .cart-item {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .cart-item-header {
            padding-right: 2rem;
            margin-bottom: 0.75rem;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.3;
            color: var(--primary);
        }

        .cart-item-pack {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .cart-item-delete {
            position: absolute;
            right: 0;
            top: 0;
            color: #E53E3E;
            padding: 4px;
            opacity: 0.7;
        }

        .cart-item-delete:active {
            opacity: 1;
        }

        .cart-item-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qty-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-body);
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .qty-btn:active {
            background: var(--border);
        }

        .qty-val {
            width: 40px;
            text-align: center;
            border: none;
            background: none;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.9rem;
            pointer-events: none;
            /* simple read only on mobile */
        }

        .cart-item-total {
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--primary);
        }

        .cart-footer {
            padding: 1.5rem;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .summary-val {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--primary);
        }

        .discount-row {
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px dashed var(--border);
        }

        .discount-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
        }

        .discount-input {
            width: 40px;
            border: none;
            background: none;
            text-align: right;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .discount-input:focus {
            outline: none;
        }

        .total-row {
            margin-top: 0.75rem;
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary);
        }

        .total-val {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .btn-generate {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border-radius: var(--radius-lg);
            font-weight: 600;
            font-size: 1rem;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-generate:disabled {
            background: var(--text-muted);
            box-shadow: none;
            opacity: 0.5;
        }

        /* Mobile Floating Cart Bar */
        .mobile-cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--cart-bar-h);
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 40;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .mobile-cart-bar.active {
            transform: translateY(0);
        }

        .mcb-info {
            display: flex;
            flex-direction: column;
        }

        .mcb-total {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.125rem;
        }

        .mcb-items {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .mcb-btn {
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        /* -----------------------
           DESKTOP ADJUSTMENTS
           ----------------------- */
        @media (min-width: 1024px) {
            .app-container {
                flex-direction: row;
            }

            .results-scroll {
                padding: 2rem;
                padding-bottom: 2rem;
            }

            /* Table layout for desktop */
            .product-list {
                display: table;
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
                background: var(--bg-surface);
                border-radius: var(--radius-lg);
                border: 1px solid var(--border);
                overflow: hidden;
            }

            .product-card {
                display: table-row;
                border: none;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
            }

            .product-card:active {
                transform: none;
            }

            .product-card>* {
                display: table-cell;
                padding: 1rem;
                border-bottom: 1px solid var(--border);
                vertical-align: middle;
            }

            .product-card:last-child>* {
                border-bottom: none;
            }

            .product-card:hover {
                background: var(--bg-body);
            }

            .prod-header {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .prod-footer {
                border: none;
                padding: 0;
                width: 150px;
                text-align: right;
                justify-content: flex-end;
                gap: 1rem;
            }

            /* Sidebar layout for desktop */
            .cart-overlay {
                display: none !important;
            }

            .cart-panel {
                position: relative;
                height: 100%;
                width: 400px;
                transform: none;
                border-radius: 0;
                border-left: 1px solid var(--border);
            }

            .cart-mobile-handle {
                display: none;
            }

            .close-cart {
                display: none;
            }

            .mobile-cart-bar {
                display: none !important;
            }
        }

        /* -----------------------
           PRINT VISTA CLIENTE
           ----------------------- */
        .print-view {
            display: none;
        }

        @media print {
            body {
                height: auto;
                overflow: visible;
                background: white;
                font-family: 'Inter', sans-serif;
                color: black;
            }

            .header,
            .main-area,
            .cart-mobile-handle,
            .cart-header,
            .close-cart,
            .client-input,
            .cart-item-controls,
            .cart-item-delete,
            .btn-generate {
                display: none !important;
            }

            .app-container {
                height: auto;
                overflow: visible;
                display: block;
            }

            .cart-panel {
                position: static;
                height: auto;
                width: 100%;
                transform: none;
                box-shadow: none;
                border: none;
                display: block;
            }

            .cart-items {
                overflow: visible;
                padding: 0;
                margin-bottom: 2rem;
            }

            .cart-footer {
                border: none;
                box-shadow: none;
                padding: 0;
                width: 300px;
                margin-left: auto;
            }

            .print-view {
                display: block;
                margin-bottom: 2rem;
                border-bottom: 2px solid #000;
                padding-bottom: 1.5rem;
            }

            .print-logo {
                height: 40px;
                filter: grayscale(100%);
                margin-bottom: 1rem;
            }

            .print-title {
                font-size: 1.5rem;
                font-weight: bold;
                margin: 0;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .print-client {
                font-size: 1.1rem;
                margin-top: 1rem;
                font-weight: 500;
            }

            .print-date {
                font-size: 0.85rem;
                color: #555;
                margin-top: 0.25rem;
            }

            .cart-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #eee;
                padding: 8px 0;
                margin: 0;
            }

            .cart-item-header {
                flex: 1;
                margin: 0;
                padding: 0;
            }

            .cart-item-title {
                font-size: 0.95rem;
            }

            .cart-item::after {
                content: attr(data-print-qty) " ud(s)  x  " attr(data-print-price) "  =  " attr(data-print-total);
                font-family: 'IBM Plex Mono', monospace;
                font-weight: bold;
                font-size: 0.9rem;
                margin-left: 2rem;
                white-space: pre;
            }

            .brand-badge {
                border: 1px solid #ccc;
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>

<body>

    <!-- Top Header -->
    <header class="header">
        <a href="index.html" class="header-brand">
            <img src="https://fresissima.it/wp-content/uploads/2025/10/Logo-fresissima.png" alt="Fresissima">
            <span class="header-title">Cotizador B2B</span>
        </a>
        <div class="header-actions">
            <a href="index.html" class="back-btn">← Volver al Dashboard</a>
        </div>
    </header>

    <div class="app-container">

        <!-- MAIN CATALOG AREA -->
        <main class="main-area">
            <div class="search-section">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Buscar por código (ej. 801-010) o descripción..." autocomplete="off">
                </div>
                <div class="filters" id="brandFilters">
                    <button class="filter-btn active" data-brand="all">Todos los Catálogos</button>
                    <button class="filter-btn" data-brand="Fresissima">Fresissima</button>
                    <button class="filter-btn" data-brand="Dentag">Dentag</button>
                    <button class="filter-btn" data-brand="Vibra">Vibra</button>
                    <button class="filter-btn" data-brand="Xtruments">Xtruments</button>
                </div>
            </div>

            <div class="results-scroll">
                <div class="product-list" id="resultsBody">
                    <!-- Cards injected via JS -->
                </div>
            </div>
        </main>

        <!-- CART BOTTOM SHEET / SIDEBAR -->
        <div class="cart-overlay" id="cartOverlay"></div>

        <aside class="cart-panel" id="cartPanel">

            <div class="cart-mobile-handle"></div>

            <!-- Print Header -->
            <div class="print-view">
                <img src="https://fresissima.it/wp-content/uploads/2025/10/Logo-fresissima.png" class="print-logo"
                    alt="Fresissima">
                <h1 class="print-title">Presupuesto Comercial</h1>
                <div class="print-client" id="printClientName">Dr. / Clínica: -</div>
                <div class="print-date" id="printDate"></div>
            </div>

            <!-- Web Header -->
            <div class="cart-header">
                <span class="cart-title">Presupuesto Actual</span>
                <button class="close-cart" id="closeCartBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="cart-client">
                <label class="client-label">Datos del Cliente</label>
                <input type="text" id="clientName" class="client-input" placeholder="Nombre del Doctor o Clínica">
            </div>

            <div class="cart-items" id="cartContainer">
                <div class="cart-empty" id="emptyCart">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        style="margin-bottom: 1rem; opacity: 0.3;">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <p>El presupuesto está vacío.</p>
                </div>
                <!-- Cart items injected via JS -->
            </div>

            <div class="cart-footer">
                <div class="summary-row">
                    <span>Subtotal PVP</span>
                    <span class="summary-val" id="subtotalVal">0,00 €</span>
                </div>
                <div class="summary-row discount-row">
                    <span>Descuento Comercial</span>
                    <div class="discount-input-wrapper">
                        <input type="number" id="discountPercent" class="discount-input" value="0" min="0" max="100">
                        <span style="font-family:var(--font-mono); font-weight:600;">%</span>
                    </div>
                </div>
                <div class="summary-row">
                    <span>Base Imponible</span>
                    <span class="summary-val" id="baseVal">0,00 €</span>
                </div>
                <div class="summary-row">
                    <span>IVA (21%)</span>
                    <span class="summary-val" id="ivaVal">0,00 €</span>
                </div>
                <div class="summary-row total-row">
                    <span>TOTAL</span>
                    <span class="total-val" id="totalVal">0,00 €</span>
                </div>

                <button class="btn-generate" id="generatePdfBtn" disabled onclick="window.print()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Imprimir o Guardar PDF
                </button>
            </div>
        </aside>

        <!-- FLOATING CART BUTTON (Mobile only) -->
        <div class="mobile-cart-bar" id="mobileCartBar">
            <div class="mcb-info">
                <span class="mcb-total" id="fabTotal">0,00 €</span>
                <span class="mcb-items" id="fabItems">0 artículos</span>
            </div>
            <button class="mcb-btn" id="openCartBtn">Ver Presupuesto</button>
        </div>

    </div>

    <!-- Data Sources -->
    <script src="js/prices-data.js"></script>
    <script src="js/prices-dentag-data.js"></script>
    <script src="js/prices-vibra-data.js"></script>
    <script src="js/prices-xtruments-data.js"></script>

    <script>
        // Combine DB
        let UNIFIED_DB = [];

        function processDB(dataArr, brandName) {
            if (!dataArr) return;
            dataArr.forEach(item => {
                let code = item[0]; let pack = item[1]; let priceStr = item[2];
                let priceNum = parseFloat(priceStr.replace('€', '').replace('.', '').replace(',', '.').trim());
                let uid = brandName.substring(0, 2).toUpperCase() + '-' + code.replace(/[^a-zA-Z0-9]/g, '');

                UNIFIED_DB.push({
                    uid: uid, brand: brandName, code: code, packaging: pack, priceStr: priceStr, price: priceNum || 0
                });
            });
        }

        processDB(PRICE_DATA, 'Fresissima');
        processDB(PRICE_DATA_DENTAG, 'Dentag');
        processDB(PRICE_DATA_VIBRA, 'Vibra');
        processDB(PRICE_DATA_XTRUMENTS, 'Xtruments');

        // State
        let filteredDB = [...UNIFIED_DB];
        let currentFilter = 'all';
        let cart = []; // Array of { item, quantity }
        let currentDiscount = 0;

        // Elements
        const searchInput = document.getElementById('searchInput');
        const resultsBody = document.getElementById('resultsBody');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const cartContainer = document.getElementById('cartContainer');
        const emptyCart = document.getElementById('emptyCart');
        const discountInput = document.getElementById('discountPercent');
        const clientInput = document.getElementById('clientName');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const mobileCartBar = document.getElementById('mobileCartBar');

        // Mobile Panels elements
        const cartOverlay = document.getElementById('cartOverlay');
        const cartPanel = document.getElementById('cartPanel');
        const openCartBtn = document.getElementById('openCartBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');

        // Init
        function init() {
            document.getElementById('printDate').textContent = `Fecha: ${new Date().toLocaleDateString()}`;
            setupUI();
            renderResults(filteredDB.slice(0, 100)); // lazy render concept
        }

        function setupUI() {
            // Search
            searchInput.addEventListener('input', debounce(handleSearch, 300));

            // Filters
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.brand;

                    // scroll fix for mobile filters
                    e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    handleSearch();
                });
            });

            // Discount
            discountInput.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                if (isNaN(val) || val < 0) val = 0;
                if (val > 100) val = 100;
                currentDiscount = val;
                updateCartTotals();
            });

            // Client Name
            clientInput.addEventListener('input', (e) => {
                document.getElementById('printClientName').textContent = e.target.value.trim() ? `Dr. / Clínica: ${e.target.value}` : 'Dr. / Clínica: -';
            });

            // Mobile Panel Actions
            openCartBtn.addEventListener('click', () => {
                cartOverlay.classList.add('show');
                cartPanel.classList.add('show');
            });

            const closePanel = () => {
                cartOverlay.classList.remove('show');
                cartPanel.classList.remove('show');
            };
            closeCartBtn.addEventListener('click', closePanel);
            cartOverlay.addEventListener('click', closePanel);
        }

        function handleSearch() {
            const term = searchInput.value.toLowerCase().trim();
            let results = UNIFIED_DB;

            if (currentFilter !== 'all') {
                results = results.filter(item => item.brand === currentFilter);
            }
            if (term !== '') {
                results = results.filter(item => item.code.toLowerCase().includes(term));
            }
            renderResults(results.slice(0, 100));
        }

        function renderResults(results) {
            if (results.length === 0) {
                resultsBody.innerHTML = `<div class="no-results">No se han encontrado resultados.</div>`;
                return;
            }

            resultsBody.innerHTML = results.map(item => {
                const brandClass = 'brand-' + item.brand.toLowerCase();
                return `
                    <div class="product-card">
                        <div class="prod-header">
                            <div>
                                <span class="prod-brand ${brandClass}">${item.brand}</span>
                                <div class="prod-code">${item.code}</div>
                                <div class="prod-pack">Envase: ${item.packaging}</div>
                            </div>
                        </div>
                        <div class="prod-footer">
                            <div class="prod-price">${item.priceStr}</div>
                            <button class="btn-add" onclick="addToCart('${item.uid}')" aria-label="Añadir">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Cart Logic
        function addToCart(uid) {
            const itemDef = UNIFIED_DB.find(i => i.uid === uid);
            if (!itemDef) return;

            const existing = cart.find(c => c.item.uid === uid);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ item: itemDef, quantity: 1 });
            }

            renderCart();
            showFeedback();
        }

        function removeFromCart(uid) {
            cart = cart.filter(c => c.item.uid !== uid);
            renderCart();
        }

        function updateQuantity(uid, change) {
            const cartItem = cart.find(c => c.item.uid === uid);
            if (cartItem) {
                cartItem.quantity += change;
                if (cartItem.quantity <= 0) {
                    removeFromCart(uid);
                    return;
                }
                renderCart();
            }
        }

        function formatMoney(num) {
            return num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
        }

        function renderCart() {
            // Remove old dynamic nodes
            const existingItems = cartContainer.querySelectorAll('.cart-item');
            existingItems.forEach(n => n.remove());

            if (cart.length === 0) {
                emptyCart.style.display = 'block';
                generatePdfBtn.disabled = true;
                mobileCartBar.classList.remove('active');
                updateCartTotals();
                return;
            }

            emptyCart.style.display = 'none';
            generatePdfBtn.disabled = false;
            mobileCartBar.classList.add('active');

            const html = cart.map(c => {
                const lineTotal = c.item.price * c.quantity;
                const brandClass = 'brand-' + c.item.brand.toLowerCase();
                return `
                    <div class="cart-item" data-print-qty="${c.quantity}" data-print-price="${formatMoney(c.item.price)}" data-print-total="${formatMoney(lineTotal)}">
                        <button class="cart-item-delete" onclick="removeFromCart('${c.item.uid}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                        <div class="cart-item-header">
                            <span class="prod-brand ${brandClass}">${c.item.brand}</span>
                            <div class="cart-item-title">${c.item.code}</div>
                            <div class="cart-item-pack">Envase: ${c.item.packaging}</div>
                        </div>
                        <div class="cart-item-controls">
                            <div class="qty-box">
                                <button class="qty-btn" onclick="updateQuantity('${c.item.uid}', -1)">-</button>
                                <input type="number" class="qty-val" value="${c.quantity}" readonly>
                                <button class="qty-btn" onclick="updateQuantity('${c.item.uid}', 1)">+</button>
                            </div>
                            <div class="cart-item-total">${formatMoney(lineTotal)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            emptyCart.insertAdjacentHTML('afterend', html);
            updateCartTotals();
        }

        function updateCartTotals() {
            let subtotal = 0;
            let totalItems = 0;
            cart.forEach(c => {
                subtotal += c.item.price * c.quantity;
                totalItems += c.quantity;
            });

            const discountAmount = subtotal * (currentDiscount / 100);
            const baseImponible = subtotal - discountAmount;
            const iva = baseImponible * 0.21;
            const total = baseImponible + iva;

            document.getElementById('subtotalVal').textContent = formatMoney(subtotal);
            document.getElementById('baseVal').textContent = formatMoney(baseImponible);
            document.getElementById('ivaVal').textContent = formatMoney(iva);
            const totalStr = formatMoney(total);
            document.getElementById('totalVal').textContent = totalStr;

            // Update mobile floating bar
            document.getElementById('fabTotal').textContent = totalStr;
            document.getElementById('fabItems').textContent = `${totalItems} artículo${totalItems !== 1 ? 's' : ''}`;
        }

        function showFeedback() {
            // Optional: light haptic feedback or visual cue
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
